[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | backend/venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
)/
'''

# isort and flake8 configs used to live here, but this file isn't actually
# where either tool reads its config from for any real invocation in this
# repo: flake8 needs the Flake8-pyproject plugin (not installed) to read
# [tool.flake8] from a pyproject.toml at all - it was silently never
# applied - and everything that runs isort/flake8 does so from backend/,
# picking up backend/.flake8 and backend/pyproject.toml's [tool.isort]
# instead. Both tools have been replaced by Ruff (see
# backend/pyproject.toml's [tool.ruff]) - removed rather than left as dead,
# never-read config.
