<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generic title - fixed</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; color: #111; background: #fff; }
      .edition { font-size: 0.875rem; color: #444; }
      .card { max-width: 32rem; border: 1px solid #767676; border-radius: 8px; padding: 1rem; }
      button, input { font: inherit; }
      button { padding: 0.5rem 0.9rem; border: 1px solid #444; border-radius: 6px; background: #eee; color: #111; }
      input { padding: 0.5rem; border: 1px solid #444; border-radius: 6px; width: 100%; box-sizing: border-box; }
      button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid #1264d0; outline-offset: 2px; }
      nav { display: flex; gap: 1rem; margin-bottom: 1rem; }
      a { color: #0b4ea8; }
      a:focus-visible { outline: 3px solid #1264d0; outline-offset: 2px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <main>
      <p class="edition">Pitfall: Generic title (<strong>fixed</strong> edition)</p>
      <nav aria-label="Main">
        <a href="#/">Home</a>
        <a href="#/settings">Settings</a>
        <a href="#/profile">Profile</a>
      </nav>
      <h1 id="heading">Home</h1>
      <p id="blurb">Welcome back.</p>
      <div id="announcer" role="status" aria-live="polite" class="sr-only"></div>
    </main>
    <script>
      // A tiny single-page app: the page never reloads, it just swaps what is shown.
      const pages = {
        '#/': ['Home', 'Welcome back.'],
        '#/settings': ['Settings', 'Change your display name and theme.'],
        '#/profile': ['Profile', 'Sarah Johnson, @sarahjohnson.'],
      };
      function render() {
        const [name, text] = pages[location.hash] || pages['#/'];
        document.getElementById('heading').textContent = name;
        document.getElementById('blurb').textContent = text;
        document.title = name + ' - Testbook';
        // A single-page app gives no "new page" cue, so announce it.
        setTimeout(() => { document.getElementById('announcer').textContent = document.title; }, 100);
      }
      window.addEventListener('hashchange', render);
    </script>
  </body>
</html>
