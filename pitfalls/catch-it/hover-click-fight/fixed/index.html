<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hover and click fight - fixed</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; color: #111; background: #fff; }
      .edition { font-size: 0.875rem; color: #444; }
      .card { max-width: 32rem; border: 1px solid #767676; border-radius: 8px; padding: 1rem; }
      button, input { font: inherit; }
      button { padding: 0.5rem 0.9rem; border: 1px solid #444; border-radius: 6px; background: #eee; color: #111; }
      input { padding: 0.5rem; border: 1px solid #444; border-radius: 6px; width: 100%; box-sizing: border-box; }
      button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid #1264d0; outline-offset: 2px; }
      .reactions { position: relative; display: inline-block; }
      .picker { position: absolute; bottom: 100%; left: 0; display: flex; gap: 0.25rem; background: #fff;
        border: 1px solid #767676; border-radius: 6px; padding: 0.4rem; visibility: hidden; }
      /* Hover reveals the picker in CSS; .open is the state set by click / keyboard. */
      .reactions:hover .picker, .picker.open { visibility: visible; }
    </style>
  </head>
  <body>
    <main>
      <p class="edition">Pitfall: Hover and click fight (<strong>fixed</strong> edition)</p>
      <h1>Sarah Johnson</h1>
      <article class="card" aria-label="Post by Sarah Johnson">
        <p>Hover or click React to choose a reaction.</p>
        <div class="reactions">
          <button id="react" aria-expanded="false" aria-controls="picker">React</button>
          <div class="picker" id="picker">
            <button aria-label="Like">&#128077;</button>
            <button aria-label="Love">&#10084;&#65039;</button>
          </div>
        </div>
      </article>
    </main>
    <script>
      const react = document.getElementById('react');
      const picker = document.getElementById('picker');
      let open = false;
      function setOpen(value) {
        open = value;
        picker.classList.toggle('open', open);
        react.setAttribute('aria-expanded', String(open));
      }
      react.addEventListener('click', () => setOpen(!open));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
      // Hover is handled entirely in CSS (.reactions:hover). The state above is only ever
      // changed by a click or key press, so it can never disagree with what the user chose.
    </script>
  </body>
</html>
