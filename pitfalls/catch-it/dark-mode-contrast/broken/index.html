<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark-mode contrast - broken</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; color: #111; background: #fff; }
      .edition { font-size: 0.875rem; color: #444; }
      .card { max-width: 32rem; border: 1px solid #767676; border-radius: 8px; padding: 1rem; }
      button, input { font: inherit; }
      button { padding: 0.5rem 0.9rem; border: 1px solid #444; border-radius: 6px; background: #eee; color: #111; }
      input { padding: 0.5rem; border: 1px solid #444; border-radius: 6px; width: 100%; box-sizing: border-box; }
      button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid #1264d0; outline-offset: 2px; }
      :root { --bg: #ffffff; --text: #111111; --accent: #1264d0; --accent-fill: #1264d0; }
      [data-theme='dark'] { --bg: #18191a; --text: #e4e6eb; --accent: #2d88ff; --accent-fill: var(--accent); }
      body { background: var(--bg); color: var(--text); }
      .card { border-color: #767676; }
      .edition { color: var(--text); }
      button { font: inherit; padding: 0.5rem 0.9rem; border-radius: 6px; border: 1px solid #444; background: #eee; color: #111; }
      .primary { background: var(--accent-fill); color: #fff; border-color: transparent; }
    </style>
  </head>
  <body>
    <main>
      <p class="edition">Pitfall: Dark-mode contrast (<strong>broken</strong> edition)</p>
      <h1>Settings</h1>
      <article class="card" aria-label="Appearance">
        <p>Choose how Testbook looks.</p>
        <p>
          <button id="theme" type="button" aria-pressed="false">Dark theme</button>
          <button class="primary" type="button">Save settings</button>
        </p>
      </article>
    </main>
    <script>
      // BUG (see the CSS): in dark mode the fill behind white text reuses --accent, which is a
      // light blue chosen to read as TEXT on a dark page. White on it is 3.45:1; 4.5:1 is needed.
      const theme = document.getElementById('theme');
      theme.addEventListener('click', () => {
        const dark = theme.getAttribute('aria-pressed') !== 'true';
        theme.setAttribute('aria-pressed', String(dark));
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      });
    </script>
  </body>
</html>
