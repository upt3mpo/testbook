<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The silent error - broken</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; color: #111; background: #fff; }
      .edition { font-size: 0.875rem; color: #444; }
      .card { max-width: 32rem; border: 1px solid #767676; border-radius: 8px; padding: 1rem; }
      button, input { font: inherit; }
      button { padding: 0.5rem 0.9rem; border: 1px solid #444; border-radius: 6px; background: #eee; color: #111; }
      input { padding: 0.5rem; border: 1px solid #444; border-radius: 6px; width: 100%; box-sizing: border-box; }
      button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid #1264d0; outline-offset: 2px; }
      form { display: grid; gap: 0.75rem; max-width: 22rem; }
      label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
      .error { color: #8a1c1c; background: #fdecec; border-radius: 6px; padding: 0.75rem; }
      button:disabled { opacity: 0.6; }
    </style>
  </head>
  <body>
    <main>
      <p class="edition">Pitfall: The silent error (<strong>broken</strong> edition)</p>
      <h1>Log in</h1>
      <form id="form" novalidate>
        <div id="slot"></div>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" />
        </div>
        <button id="submit" type="submit">Log in</button>
      </form>
    </main>
    <script>
      const form = document.getElementById('form');
      const submit = document.getElementById('submit');
      const slot = document.getElementById('slot');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        slot.innerHTML = '';
        submit.disabled = true; // a request is "in flight"; a disabled button cannot hold focus
        setTimeout(() => {
          submit.disabled = false;
          const error = document.createElement('div');
          error.className = 'error';
          error.textContent = 'Incorrect email or password';
          // BUG: a plain <div>. Nothing announces it, and focus stays on <body>.
          slot.appendChild(error);

        }, 250);
      });
    </script>
  </body>
</html>
