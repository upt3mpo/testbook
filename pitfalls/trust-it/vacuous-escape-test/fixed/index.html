<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vacuous Escape test - fixed</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; color: #111; background: #fff; }
      .edition { font-size: 0.875rem; color: #444; }
      .card { max-width: 32rem; border: 1px solid #767676; border-radius: 8px; padding: 1rem; }
      button, input { font: inherit; }
      button { padding: 0.5rem 0.9rem; border: 1px solid #444; border-radius: 6px; background: #eee; color: #111; }
      input { padding: 0.5rem; border: 1px solid #444; border-radius: 6px; width: 100%; box-sizing: border-box; }
      button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid #1264d0; outline-offset: 2px; }
      .wrap { position: relative; display: inline-block; }
      ul { position: absolute; top: 100%; left: 0; margin: 0.25rem 0 0; padding: 0.5rem 1rem; list-style: none;
        background: #fff; border: 1px solid #767676; border-radius: 6px; min-width: 8rem; }
      ul[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <p class="edition">Pitfall: Vacuous Escape test (<strong>fixed</strong> edition)</p>
      <h1>Sarah Johnson</h1>
      <article class="card" aria-label="Post by Sarah Johnson">
        <p>Hover or click Menu.</p>
        <div class="wrap">
          <button id="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button>
          <ul id="menu" aria-label="Post actions" hidden><li>Edit</li><li>Delete</li></ul>
        </div>
      </article>
    </main>
    <script>
      const btn = document.getElementById('menu-btn');
      const menu = document.getElementById('menu');
      let open = false;
      function setOpen(v) { open = v; menu.hidden = !v; btn.setAttribute('aria-expanded', String(v)); }
      btn.addEventListener('click', () => setOpen(!open));
      // Hover and click write the SAME state (the real Testbook bug, see catch-it/hover-click-fight).
      // That is what makes the suspect test pass for the wrong reason.
      const wrap = document.querySelector('.wrap');
      wrap.addEventListener('mouseenter', () => setOpen(true));
      wrap.addEventListener('mouseleave', () => setOpen(false));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
    </script>
  </body>
</html>
