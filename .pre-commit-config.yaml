repos:
  # General file checks (safe and useful)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        additional_dependencies: [markdownlint-cli2]
        exclude: |
          (?x)^(
            \.github/.*|
            \.devcontainer/.*
          )$

  # Python code quality
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]
        exclude: |
          (?x)^(
            \.venv/.*|
            venv/.*|
            backend/venv/.*|
            __pycache__/.*|
            \.pytest_cache/.*
          )$

  # Ruff replaces isort + flake8 here: its `I` ruleset covers import
  # sorting and its `E`/`F` rules cover what flake8 was configured for.
  # Config lives in backend/pyproject.toml ([tool.ruff]) — deliberately
  # scoped to E/F/I only (not ruff's stricter opt-in categories) so it
  # doesn't overwhelm a teaching codebase with unrelated lint noise.
  # Verified this passes clean on the current codebase before enabling.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
        exclude: ^backend/tests/examples/

  # JavaScript/Node.js quality (optional - can be enabled later)
  # - repo: https://github.com/pre-commit/mirrors-eslint
  #   rev: v9.15.0
  #   hooks:
  #     - id: eslint
  #       files: \.(js|jsx)$
  #       additional_dependencies:
  #         - eslint@^8.0.0
  #         - eslint-plugin-react@^7.33.0
  #         - eslint-plugin-react-hooks@^4.6.0
  #         - eslint-plugin-jsx-a11y@^6.8.0
  #       args: [--fix]

  # Security checks. A fresh scan turned up 158 candidate matches, all
  # triaged by hand (see docs/AUDIT_REPORT.md). 148 are excluded below
  # by path because the file or tree is entirely fixture, demo, or
  # teaching content: seed account passwords, e2e/security/performance
  # test credentials, CI-only environment values, or markdown showing
  # what a credential looks like in an example. The remaining 10, in
  # backend/auth.py and backend/seed.py, are marked inline with
  # `# pragma: allowlist secret` instead, since those are real
  # application files where a future genuine secret should still get
  # caught.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            package-lock\.json$|
            yarn\.lock$|
            \.venv/.*|
            venv/.*|
            backend/venv/.*|
            node_modules/.*|
            \.github/workflows/.*|
            backend/tests/.*|
            frontend/src/tests/.*|
            tests/.*|
            learn/solutions/.*|
            .*\.md$
          )$
