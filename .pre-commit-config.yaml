  #         - eslint-plugin-react@^7.33.0
  #         - eslint-plugin-react-hooks@^4.6.0
  #         - eslint-plugin-jsx-a11y@^6.8.0
  #       args: [--fix]

  # Security checks - NOT enabled yet. .secrets.baseline exists but is
  # stale (generated once, never re-scanned): running `detect-secrets
  # scan --baseline .secrets.baseline` against the current repo turns up
  # ~1200 new candidate matches (mostly CI env-var fixtures and seed
  # test passwords, not real secrets, but that needs a human to actually
  # review and allowlist each one before this can be turned on without
  # blocking every future commit). Regenerating and triaging the
