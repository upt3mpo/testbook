repos:
  # General file checks (safe and useful)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key

  # Markdown linting. docs/AUDIT_REPORT.md is excluded deliberately, not
  # missed: it's a maintainer-facing, dated audit trail across many past
  # passes, and its original (pre-this-pass) sections have real MD022/
  # MD032 issues that every pass has chosen not to touch, to keep each
  # dated section an honest record of what was true when it was written,
  # not silently rewritten by a later formatting pass. That was informal
  # policy until this repo's markdownlint version was old enough to never
  # actually catch these - upgrading it made this exclusion necessary to
  # write down explicitly, not just remembered.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        additional_dependencies: [markdownlint-cli2]
        exclude: |
          (?x)^(
            \.github/.*|
            \.devcontainer/.*|
            docs/AUDIT_REPORT\.md
          )$

  # Python code quality. Pinned to match backend/requirements.txt's own
  # black==25.1.0 exactly, not just "close enough" - a real release
  # (26.5.1 as of this check) exists, but bumping only this hook's rev
  # without also bumping requirements.txt would split black into two
  # different enforced versions, the same class of problem the isort/
  # Flake8-vs-Ruff split was. requirements.txt's black already has an open
  # Dependabot PR (25.1.0 to 25.11.0); bump this rev to match whatever
  # version that PR lands at, together, not ahead of it.
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]
        exclude: |
          (?x)^(
            \.venv/.*|
            venv/.*|
            backend/venv/.*|
            __pycache__/.*|
            \.pytest_cache/.*
          )$

  # Ruff replaces isort + flake8 - not just here, everywhere: CI's
  # lint-backend job and scripts/quality-check.sh both run `ruff check`
  # too now, instead of installing and running isort/flake8 separately.
  # Config lives in backend/pyproject.toml ([tool.ruff]) - re-triaged
  # against `ruff check . --select=ALL` and now covers 24 rule categories
  # (not just E/F/I), each checked against real hits in this codebase
  # before being enabled - see the comment on [tool.ruff.lint] there for
  # the full reasoning. Verified this passes clean on the current codebase
  # before enabling.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
        exclude: ^backend/tests/examples/

  # Type checking. A local hook (not the mirror-mypy repo) because this
  # codebase's types depend on the real installed packages - SQLAlchemy
  # 2.0's Mapped[] stubs, FastAPI's Request/Response types, Pydantic
  # models - and the mirror's isolated hook environment would need every
  # one of those duplicated into additional_dependencies, drifting from
  # backend/requirements.txt's actual pinned versions over time. Runs
  # the backend venv's own mypy directly instead. Verified this passes
  # clean on the current codebase (backend/pyproject.toml's [tool.mypy])
  # before enabling.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: backend/.venv/bin/mypy --config-file=backend/pyproject.toml backend
        language: system
        files: ^backend/(?!tests/examples/).*\.py$
        pass_filenames: false

  # JavaScript/Node.js quality (optional - can be enabled later)
  # - repo: https://github.com/pre-commit/mirrors-eslint
  #   rev: v9.15.0
  #   hooks:
  #     - id: eslint
  #       files: \.(js|jsx)$
  #       additional_dependencies:
  #         - eslint@^8.0.0
  #         - eslint-plugin-react@^7.33.0
  #         - eslint-plugin-react-hooks@^4.6.0
  #         - eslint-plugin-jsx-a11y@^6.8.0
  #       args: [--fix]

  # Security checks. A fresh scan turned up 158 candidate matches, all
  # triaged by hand (see docs/AUDIT_REPORT.md). 148 are excluded below
  # by path because the file or tree is entirely fixture, demo, or
  # teaching content: seed account passwords, e2e/security/performance
  # test credentials, CI-only environment values, or markdown showing
  # what a credential looks like in an example. The remaining 10, in
  # backend/auth.py and backend/seed.py, are marked inline with
  # `# pragma: allowlist secret` instead, since those are real
  # application files where a future genuine secret should still get
  # caught.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            package-lock\.json$|
            yarn\.lock$|
            \.venv/.*|
            venv/.*|
            backend/venv/.*|
            node_modules/.*|
            \.github/workflows/.*|
            backend/tests/.*|
            frontend/src/tests/.*|
            tests/.*|
            learn/solutions/.*|
            .*\.md$
          )$
