name: Pre-commit
# Last Updated: October 2025

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up backend virtual environment
        # The local mypy hook in .pre-commit-config.yaml runs
        # backend/.venv/bin/mypy directly (not the mirror-mypy repo, since
        # this codebase's type-checking depends on the real installed
        # packages - see the comment on that hook). That path only exists
        # if this venv is created first; a developer's own machine already
        # has it from normal setup, but a fresh CI checkout doesn't.
        working-directory: ./backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure
