name: Pitfalls
# The standalone teaching pages in pitfalls/. These have their OWN tests, deliberately
# separate from Testbook's suite: each pitfall proves its bug is real (the reference test
# must fail on the broken page and pass on the fixed one) in both language tracks.

permissions:
  contents: read

concurrency:
  group: pitfalls-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths:
      - 'pitfalls/**'
      - '.github/workflows/pitfalls.yml'
  pull_request:
    paths:
      - 'pitfalls/**'
      - '.github/workflows/pitfalls.yml'
  workflow_dispatch:

jobs:
  pitfalls:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: pitfalls/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pitfalls/requirements.txt

      - name: Install dependencies
        working-directory: ./pitfalls
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Install Chromium
        working-directory: ./pitfalls
        run: npx playwright install --with-deps chromium

      - name: JavaScript reference solutions and catalog
        working-directory: ./pitfalls
        env:
          FORCE_COLOR: 0
        run: npm test

      - name: Python reference solutions
        working-directory: ./pitfalls
        run: python -m pytest

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitfalls-report
          path: pitfalls/playwright-report/
          retention-days: 7
