[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | htmlcov
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
known_first_party = ["models", "schemas", "auth", "database", "logger"]
known_third_party = ["fastapi", "sqlalchemy", "pydantic", "slowapi", "jose", "passlib"]

[tool.ruff]
line-length = 88
target-version = "py313"
# tests/examples/ contains deliberately-illustrative code (including an
# intentionally-flawed bad_tests.py used to teach anti-patterns) - it's
# not part of the real test suite and isn't meant to lint clean.
extend-exclude = ["tests/examples"]

[tool.ruff.lint]
# A deliberately small, beginner-appropriate ruleset for a teaching
# codebase: pyflakes (undefined names, unused imports) and pycodestyle
# errors, plus import-sort ordering. Not enabling ruff's stricter opt-in
# categories (bandit-style security checks, comprehension rewrites,
# blind-except warnings, etc.) - those produce a lot of noise on code
# this size without teaching a beginner anything they're ready for yet.
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is black's job, not ruff's

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/examples/"]
# No sqlalchemy mypy plugin needed: models.py uses SQLAlchemy 2.0's
# native Mapped[]/mapped_column() style with a class-based
# DeclarativeBase (see database.py), which mypy understands directly.
# The plugin was tried first (needed for the older Column()-style
# declarative models this file used before this pass), but on this
# mypy/SQLAlchemy version pairing it silently failed to synthesize a
# working __init__ for the mapped classes - every ORM constructor call
# (e.g. models.User(email=...)) came back "Unexpected keyword
# argument" even though the attribute was a plain, correctly mapped
# column. Migrating to Mapped[] removed the need for the plugin
# entirely, which also removed that failure mode.
